<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="navbar">
        <h2>Staff Dashboard</h2>
        <a href="login.html" class="logout">Logout</a>
    </div>

    <div class="cards">

        <div class="card">
            <h3>25</h3>
            <p>Total Tasks</p>
        </div>

        <div class="card">
            <h3>18</h3>
            <p>Completed</p>
        </div>

        <div class="card">
            <h3>7</h3>
            <p>Pending</p>
        </div>

        <div class="card">
            <h3>95%</h3>
            <p>Attendance</p>
        </div>

    </div>

    <div class="task-section">

        <h2>My Tasks</h2>

        <table>
            <tr>
                <th>ID</th>
                <th>Task Name</th>
                <th>Status</th>
                <th>Deadline</th>
            </tr>

            <tr>
                <td>001</td>
                <td>Create Home Page</td>
                <td>Completed</td>
                <td>10-Jun-2026</td>
            </tr>

            <tr>
                <td>002</td>
                <td>Portfolio Section</td>
                <td>In Progress</td>
                <td>12-Jun-2026</td>
            </tr>

            <tr>
                <td>003</td>
                <td>Contact Form</td>
                <td>Pending</td>
                <td>15-Jun-2026</td>
            </tr>
        </table>

    </div>

</body>
</html>
